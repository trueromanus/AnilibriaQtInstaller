name: CI and Release

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  windows64:
    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src/Installer.csproj
    - name: Publish application
      run: dotnet publish -r win-x64 -c Release --self-contained true src/Installer.csproj
    - name: Publish arm64 application
      run: dotnet publish -r win-arm64 -c Release --self-contained true src/Installer.csproj
    - name: Upload x64 artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windows64
        path: src/bin/Release/net10.0/win-x64/publish/AniLibriaQtLauncher.exe
    - name: Upload arm64 artifacts
      uses: actions/upload-artifact@v6
      with:
        name: windowsarm64
        path: src/bin/Release/net10.0/win-arm64/publish/AniLibriaQtLauncher.exe

  macos64:
    runs-on: macos-latest    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore src/Installer.csproj
    - name: Publish x64 application
      run: dotnet publish -r osx-x64 -c Release --self-contained true src/Installer.csproj
    - name: Publish arm64 application
      run: dotnet publish -r osx-arm64 -c Release --self-contained true src/Installer.csproj
    - name: Upload x64 artifacts
      uses: actions/upload-artifact@v6
      with:
        name: macos64
        path: src/bin/Release/net10.0/osx-x64/publish/AniLibriaQtLauncher
    - name: Upload arm64 artifacts
      uses: actions/upload-artifact@v6
      with:
        name: macosarm64
        path: src/bin/Release/net10.0/osx-arm64/publish/AniLibriaQtLauncher

  linux64:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Publish x64 application
      run: dotnet publish -r linux-x64 -c Release --self-contained true src/Installer.csproj
    - uses: actions/upload-artifact@v6
      with:
        name: linux64
        path: src/bin/Release/net10.0/linux-x64/publish/AniLibriaQtLauncher

  linuxarm64:
    runs-on: ubuntu-24.04-arm
    
    steps:
    - name: Checkout
      uses: actions/checkout@v6
    - name: Install .NET Core
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x
    - name: Publish arm x64 application      
      run: dotnet publish -r linux-arm64 -c Release -p:PublishAot=false --self-contained true src/Installer.csproj
    - uses: actions/upload-artifact@v6
      with:
        name: linuxarm64
        path: src/bin/Release/net10.0/linux-arm64/publish/AniLibriaQtLauncher
